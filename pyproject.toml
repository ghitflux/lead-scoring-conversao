[project]
name = "lead-scoring"
version = "0.1.0"
description = "Previsão de conversão de leads com validação temporal, calibração e tradução para lucro"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_scoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
